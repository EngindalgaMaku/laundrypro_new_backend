<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LaundryPro</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; color: #475569; margin: 0 0 24px; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #3b82f6;
        border: 0;
        border-radius: 12px;
        padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true"></div>
      <h1>Bağlantı kurulamadı</h1>
      <p>İnternet bağlantınızı kontrol edip yeniden deneyin.</p>
      <button type="button" id="retry">Yeniden dene</button>
    </main>
    <script>
      // Filled in by scripts/cap-sync.mjs; only this page is served locally, so the URL is inlined
      var serverUrl = "__SERVER_URL__";

      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = serverUrl;
      });
    </script>
  </body>
</html>
